AWSTemplateFormatVersion: '2010-09-09'
Description: Private Cheapo shopping-history database and photo storage in Stockholm.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing Stockholm VPC with DNS support.
  DatabaseSubnetACidr:
    Type: String
    Description: Unused IPv4 range in the VPC for the private eu-north-1a subnet.
  DatabaseSubnetBCidr:
    Type: String
    Description: Unused IPv4 range in the VPC for the private eu-north-1b subnet.

Rules:
  StockholmOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', eu-north-1]
        AssertDescription: Cheapo shopping storage belongs in eu-north-1.

Resources:
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: Hosts the Single-AZ database in the first Stockholm zone.
        must: Keep public IPv4 assignment disabled.
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: eu-north-1a
      CidrBlock: !Ref DatabaseSubnetACidr
      MapPublicIpOnLaunch: false

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: Satisfies the database subnet group's second-zone requirement.
        must: Keep public IPv4 assignment disabled.
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: eu-north-1b
      CidrBlock: !Ref DatabaseSubnetBCidr
      MapPublicIpOnLaunch: false

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
        why: Gives both database subnets only local VPC routes.
        must: Keep internet and NAT routes out of this table.
    Properties:
      VpcId: !Ref VpcId

  PrivateRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps the first database subnet off the VPC's default routes.
        must: Associate the private route table.
    Properties:
      SubnetId: !Ref DatabaseSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps the second database subnet off the VPC's default routes.
        must: Associate the private route table.
    Properties:
      SubnetId: !Ref DatabaseSubnetB
      RouteTableId: !Ref PrivateRouteTable

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Places RDS in the isolated subnets.
        must: Include private subnets in two different Stockholm zones.
    DependsOn: [PrivateRouteA, PrivateRouteB]
    Properties:
      DBSubnetGroupDescription: Private Cheapo database subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Gives the database a dedicated access boundary.
        must: Permit PostgreSQL only from explicitly authorized workload security groups.
    Properties:
      GroupDescription: Cheapo PostgreSQL
      VpcId: !Ref VpcId

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds relational shopping data while large photo files live separately.
        must: Keep encrypted storage, certificate-verified client TLS, backups and deletion protection.
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '17.11'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      AutoMinorVersionUpgrade: true
      DBName: cheapo
      MasterUsername: cheapo_admin
      ManageMasterUserPassword: true
      MultiAZ: false
      AvailabilityZone: eu-north-1a
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true

  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores private original and cropped evidence independently of the guest app.
        must: Keep public access blocked, bucket-owner enforcement and encryption enabled.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Requires encryption in transit and preserves that guard if the bucket is retained.
        must: Deny non-TLS traffic for both the bucket and its objects.
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PhotoBucket.Arn
              - !Sub '${PhotoBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DatabaseIdentifier:
    Value: !Ref Database
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecurityGroupId:
    Value: !GetAtt DatabaseSecurityGroup.GroupId
  PhotoBucketName:
    Value: !Ref PhotoBucket
