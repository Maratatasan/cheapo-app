appId: host.exp.exponent
---
- openLink: exp://10.0.2.2:8081
- runFlow:
    when:
      visible: "Take Picture of Price"
    commands:
      - back
- runFlow:
    when:
      visible: "Grant Permission"
    commands:
      - back
- assertVisible: "Scan item"
- tapOn: "Scan item"
- runFlow:
    when:
      visible: "Select current shop"
    commands:
      - tapOn: "Add a shop"
      - tapOn: "Tandem Centre Lidl"
      - inputText: "Camera smoke shop"
      - hideKeyboard
      - tapOn: "Save shop"
- assertVisible: "Grant Permission|Take Picture of Price"
- runFlow:
    when:
      visible: "Grant Permission"
    commands:
      - assertVisible: "We need your permission to show the camera"
- runFlow:
    when:
      visible: "Take Picture of Price"
    commands:
      - assertVisible: "Flip Camera"
