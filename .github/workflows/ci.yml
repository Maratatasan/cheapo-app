name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/route1-feasibility]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Java for native auth helper tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identify Turbo cache toolchain
        id: turbo-toolchain
        run: |
          prefix="turbo-v1-${RUNNER_OS}-${RUNNER_ARCH}-node-$(node --version)-pnpm-$(pnpm --version)-turbo-$(pnpm exec turbo --version)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo task cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-toolchain.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.turbo-toolchain.outputs.prefix }}-

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build component library
        run: pnpm ui:storybook:build

      - name: Run Route 1 demo tests
        run: pnpm test:route1

      - name: Run native auth helper tests
        run: pnpm test:auth-native

      - name: Check Expo dependency compatibility
        run: pnpm expo install --check

      - name: Run Expo Doctor
        run: pnpm expo:doctor

      - name: Export Android, iOS, and web bundles
        run: pnpm build

      - name: Save Turbo task cache from main
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-toolchain.outputs.prefix }}-${{ github.sha }}
